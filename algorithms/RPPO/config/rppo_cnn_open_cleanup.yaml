# RPPO (recurrent RL^2) on OpenCleanup, the game of experiments/open_cleanup_5ag.
defaults:
  - rppo_base
  - _self_
  - reward: individual  # override on the CLI: reward=common

"ENV_NAME": "open_cleanup"

# Arguments of llm_policy.open_cleanup_policy.make_env, as experiments/open_cleanup_5ag/config.json sets them:
# 5 agents, 5 trials x 400 steps, waste spawn 0.1, one waste hue per meta-episode (skew 1.0), shared tools,
# a random map per meta-episode. on_train is set by the trainer (training split / held-out split).
"ENV_KWARGS":
  "agents": 5
  "inner": 400
  "outer": 5
  "spawn": 0.1
  "skew": 1.0
  "tools": "shared"
  "layouts": "random"

# Training curriculum: the fraction of the river's waste cells that open dirty in a TRAINING trial. 1.0 is the
# evaluated game, where a random policy scores exactly 0 (the river never drops below the apple threshold), so RL^2
# from scratch sees no reward at all. A [lo, hi] range draws the fraction per trial, so every batch mixes trials that
# pay from the first step with trials that only pay once the right tool is found. Held-out evaluation always plays 1.0.
#   e.g.  TRAIN_INITIAL_DIRT=[0.5,1.0]
"TRAIN_INITIAL_DIRT": 1.0
