# Base RPPO (recurrent RL^2 PPO) configuration, shared by every rppo_cnn_<env>.yaml.
# The per-env file sets ENV_NAME and ENV_KWARGS (the arguments of the LLM harness's make_env for that game).

# PPO training hyperparameters
"LR": 0.0005
"NUM_ENVS": 256
# TBPTT chunk length, the analog of XLand-MiniGrid's num_steps_per_update=32:
# the hidden state is carried across updates, so gradients see NUM_STEPS-long
# windows while memory itself spans the whole meta-episode. Keep it a divisor
# of num_inner_steps*num_outer_steps so meta-episode boundaries land on
# rollout edges: 125 divides OpenCleanup's 5 x 400 (16 chunks) and
# OpenHarvest's 5 x 300 (12 chunks). Backpropagating through a whole
# meta-episode at once (an earlier setting) mostly vanished the gradient.
"NUM_STEPS": 125
"TOTAL_TIMESTEPS": 1e8
"UPDATE_EPOCHS": 1        # XLand-MiniGrid recipe
"NUM_MINIBATCHES": 4     # minibatches split ACTORS, not steps (sequences stay whole)
"GAMMA": 0.99
"GAE_LAMBDA": 0.95
"CLIP_EPS": 0.2
"ENT_COEF": 0.01
"VF_COEF": 0.5
"MAX_GRAD_NORM": 0.5
"ACTIVATION": "relu"

# Training settings
"ANNEAL_LR": True
"PARAMETER_SHARING": True   # one recurrent policy for every agent, each with its own hidden state
"TUNE": False

# Seed and evaluation
"SEED": 30
"NUM_SEEDS": 1
"GIF_NUM_FRAMES": 250

# WandB defaults
"ENTITY": ""
"PROJECT": "opensocialjax"
"WANDB_MODE": "online"

# --- recurrent (RL^2) specific ------------------------------------------------
# The GRU carries evidence across the trials of a meta-episode, and the policy
# additionally sees its previous action and previous reward. Sizes follow the
# XLand-MiniGrid meta-task recipe (rnn 1024, heads 256, adam eps 1e-8).
"RNN_HIDDEN_SIZE": 1024
"HEAD_HIDDEN_SIZE": 256
"ADAM_EPS": 1.0e-8
# False: actor and critic share the encoder + GRU (XLand-MiniGrid). True: the critic has its own encoder, GRU and
# optimiser (JaxMARL MAPPO / Mava / Stoix). With a shared trunk and returns of tens of points the value loss
# supplies ~99.7 % of the trunk's gradient (OpenHarvest, 11-07), so the GRU is shaped by the critic, not the policy.
"SEPARATE_CRITIC": False
# Self-supervised auxiliary loss weight (0 disables). Only environments that
# define an auxiliary target support it (OpenCleanup: from the hidden state,
# predict whether this step's cleaning shot clears its target).
"AUX_COEF": 0.0
# Path to a checkpoint to initialise from (curriculum); empty = fresh init.
"WARM_START": ""

# --- held-out evaluation --------------------------------------------------------
# Training plays the training splits of the rules and maps, evaluation the
# held-out splits (the ones the LLM agents play), so "did it adapt?" is
# separable from "did it memorise every rule?". Logged per evaluation: the
# meta-episode return (mean / median / 20th percentile, per agent) and the
# mean return of every trial (eval/return_trial_k).
"EVAL_EVERY": 50          # updates between held-out evaluations
"EVAL_NUM_ENVS": 64
"EVAL_SEED": 42           # fixed, so the eval curve is comparable across runs
